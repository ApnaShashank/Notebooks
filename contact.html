<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <section id="contact">
        <h1>Contact Us</h1>
        <div class="border"></div>
        <form class="contact-form" method="post">
            <input type="text" id="contact-name" class="contact-form-text" placeholder="Your Name">
            <input type="email" id="contact-email" class="contact-form-text" placeholder="Your email">
            <input type="text" id="contact-phone" class="contact-form-text" placeholder="Your phone (Optional)">
            <textarea id="contact-message" class="contact-form-text" placeholder="Your message"></textarea>
            <input class="btn" type="submit" value="Send">
        </form>
    </section>
<script src="contact.js"></script>
</body>

</html>
